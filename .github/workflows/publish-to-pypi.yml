name: Publish Python 🐍 distributions 📦 to PyPI

# Publishes ONLY on a release tag (the /release skill pushes it). PyPI never accepts the
# same version twice, so a publish on every push either fails or burns a version number.
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Test, build and publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        run: |
          python -m pip install --upgrade pip gspread pytest
          python -m pytest tests/ -q

      - name: Tag matches package version
        run: |
          VERSION=$(python -c "import re; print(re.search(r\"__version__\s*=\s*['\\\"]([^'\\\"]+)\", open('gsconfig/__init__.py').read()).group(1))")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != __version__ $VERSION"; exit 1; }

      - name: Build a binary wheel and a source tarball
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
